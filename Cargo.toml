[package]
name = "propbench"
version = "0.1.0"
edition = "2021"
default-run = "propbench"
description = "CLI tool for PropBench — LLM benchmark for propositional logic proofs"

[[bin]]
name = "propbench"
path = "src/main.rs"
required-features = ["owner-tools"]

[[bin]]
name = "propbench-validate"
path = "src/bin/propbench-validate.rs"

[features]
default = ["owner-tools"]
owner-tools = ["dep:rand", "dep:sha2"]

[dependencies]
logic-core = { git = "https://github.com/dogaozden/logic-core", tag = "v0.3.4" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
